name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: core/go.sum
      - name: Проверка Go-ядра
        working-directory: core
        run: go vet ./... && go test -race -timeout 120s ./...
      - name: Проверка форматирования
        working-directory: core
        run: test -z "$(gofmt -l .)"

  android:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: core/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK, NDK и CMake
        run: bash scripts/install-sdk.sh
      - name: ciadpi и Go AAR
        run: bash scripts/build-engine.sh
      - name: Debug, тесты и lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Подготовить ключ релиза
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Подписанные release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash gradlew :app:assembleRelease -PsplitApk
      - name: Подготовить файлы релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          VERSION="$(sed -n 's/ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/razgon-v$VERSION-universal.apk"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-apks
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Разгон $VERSION" --notes-file docs/RELEASE.md --latest --prerelease=false --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Разгон $VERSION" --notes-file docs/RELEASE.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name != \"razgon-v$VERSION-universal.apk\") | .id" > obsolete-assets.txt
          while read -r ASSET_ID; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          done < obsolete-assets.txt
